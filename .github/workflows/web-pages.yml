name: Web (GitHub Pages)

# Publica la versión web en la rama gh-pages, que GitHub Pages sirve en
# https://<usuario>.github.io/<repositorio>/. Es la que se instala en iPhone
# desde Safari (Compartir > Agregar a inicio); también sirve en Android y PC.
# Si el sitio no aparece: Settings > Pages > Source: Deploy from a branch > gh-pages.
on:
  push:
    branches: [main, claude/gym-tracker-app]
    paths-ignore: ['**.md', 'legacy-streamlit/**', 'android/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publicar en gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publicar $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
